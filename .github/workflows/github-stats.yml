name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    name: Generate GitHub Profile Stats
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout Repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # GitHub Stats
      # ==========================================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=azmanio
            &show_icons=true
            &hide_border=true
            &theme=transparent
            &rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Top Languages
      # ==========================================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=azmanio
            &layout=compact
            &langs_count=8
            &hide_border=true
            &theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GitHub Streak
      # ==========================================

      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: >-
            user=azmanio
            &theme=transparent
            &hide_border=true
            &date_format=j%20M%5B%20Y%5D
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GitHub Contribution Snake
      # ==========================================

      - name: Generate GitHub Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: azmanio
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark

      # ==========================================
      # Commit Generated Files
      # ==========================================

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile stats"
          git push
